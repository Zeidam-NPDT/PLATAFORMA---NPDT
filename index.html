<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma de Inteligência Turística - Jijoca de Jericoacoara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<title>Inteligência Turística de Jijoca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF3F8; --surface:#FFFFFF; --surface-2:#F5F9FC; --surface-3:#E2ECF4;
  --ink:#0E2735; --ink-2:#476371; --ink-3:#7B939F;
  --line:#D5E4EE; --line-2:#BED3E0;
  --brand:#00457B; --brand-2:#1268AE; --accent:#E2700A;
  --c1:#1268AE; --c2:#E2700A; --c3:#00969E; --c4:#7E9116; --c5:#8F5410;
  --good:#2E7D4F; --warn:#B4690E; --bad:#B3392C;
  --shadow:0 1px 2px rgba(15,36,48,.06), 0 4px 16px rgba(15,36,48,.06);
  --radius:14px;
  --display:'Archivo','Archivo Narrow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; line-height:1.22; font-weight:700; letter-spacing:-.012em; font-family:var(--display); text-wrap:balance}
.kpi .k-val,.nps-score,.hero h1{font-family:var(--display)}
:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important}}
.wrap{max-width:1320px; margin:0 auto; padding:0 20px 64px}

/* NAV */
.nav{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:var(--shadow)}
.nav-in{max-width:1320px; margin:0 auto; padding:6px 20px; display:flex; align-items:center; gap:14px; min-height:72px; flex-wrap:wrap}
.nav-logo{height:46px; width:auto; cursor:pointer; flex:none}
.nav-tabs{display:flex; gap:2px; flex:1; flex-wrap:wrap; row-gap:0}
.tab{appearance:none; border:0; background:none; cursor:pointer; white-space:nowrap; padding:12px 11px 10px;
  font:inherit; font-size:13px; font-weight:600; color:var(--ink-2); border-bottom:3px solid transparent; border-radius:8px 8px 0 0; transition:.15s}
.tab:hover{color:var(--ink); background:var(--surface-2)}
.tab[aria-current="true"]{color:var(--ink); border-bottom-color:var(--tabc,var(--brand-2))}
.tab .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:7px; vertical-align:1px}
.tab .soon{font-family:var(--display); font-size:9px; font-weight:700; letter-spacing:.04em; color:var(--ink-3); margin-left:6px; border:1px solid var(--line-2); border-radius:4px; padding:1px 4px}

/* PAGE HEAD */
.phead{padding:26px 0 18px; min-width:0; border-bottom:1px solid var(--line); margin-bottom:20px}
.phead h2{font-size:26px}
.phead .accentbar{width:46px; height:4px; border-radius:3px; background:var(--tabc,var(--brand-2)); margin-bottom:12px}
.phead p{margin:7px 0 0; color:var(--ink-2); font-size:14px; max-width:62ch}

/* SLICERS + FILTROS */
.slicers{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px 16px; margin-bottom:16px; display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center}
.sl{display:flex; align-items:center; gap:9px; min-width:0; flex-wrap:wrap}
.sl > label{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{appearance:none; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); cursor:pointer;
  font:inherit; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:8px; transition:.12s; white-space:nowrap}
.chip:hover{border-color:var(--brand-2); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand-2); border-color:var(--brand-2); color:#fff}
.chip:disabled{opacity:.5; cursor:not-allowed}
.chip.sm{font-size:11.5px; padding:4px 9px}
.sw{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.sw input{appearance:none; width:36px; height:20px; border-radius:20px; background:var(--surface-3); border:1px solid var(--line-2); position:relative; cursor:pointer; transition:.15s; flex:none; margin:0}
.sw input::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:.15s}
.sw input:checked{background:var(--c2); border-color:var(--c2)}
.sw input:checked::after{left:18px}
.fbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:color-mix(in srgb,var(--c2) 8%,var(--surface));
  border:1px solid color-mix(in srgb,var(--c2) 30%,transparent); border-radius:11px; padding:9px 12px; margin-bottom:16px}
.fbar .lb{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c2)}
.fchip{display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line-2);
  border-radius:8px; padding:4px 6px 4px 10px; font-size:12.5px; font-weight:600}
.fchip em{font-style:normal; color:var(--ink-3); font-weight:600}
.fchip button{appearance:none; border:0; background:var(--surface-3); color:var(--ink-2); width:19px; height:19px; border-radius:5px;
  cursor:pointer; font-size:13px; line-height:1; display:grid; place-items:center; padding:0}
.fchip button:hover{background:var(--bad); color:#fff}
.clearall{appearance:none; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); cursor:pointer;
  font:inherit; font-size:12px; font-weight:700; padding:5px 11px; border-radius:8px; margin-left:auto}
.clearall:hover{border-color:var(--bad); color:var(--bad)}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:14px; margin-bottom:18px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:17px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--kc,var(--brand-2))}
.kpi .k-lab{font-size:12px; font-weight:600; color:var(--ink-2); line-height:1.35; min-height:2.7em; display:flex; align-items:flex-start}
.kpi .k-val{font-size:30px; font-weight:800; letter-spacing:-.025em; margin-top:6px; font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:15px; font-weight:600; color:var(--ink-2); letter-spacing:0}
.kpi .k-sub{font-size:11.5px; color:var(--ink-3); margin-top:5px; font-variant-numeric:tabular-nums}
.delta{display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:700; border-radius:5px; padding:2px 6px; margin-top:6px}
.delta.up{color:var(--good); background:color-mix(in srgb,var(--good) 12%,transparent)}
.delta.down{color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,transparent)}
.delta.flat{color:var(--ink-3); background:var(--surface-3)}

/* CARDS */
.grid{display:grid; gap:16px; margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px 20px; box-shadow:var(--shadow); min-width:0}
.card > header{display:flex; align-items:flex-start; gap:10px; margin-bottom:2px}
.card h3{font-size:14.5px; font-weight:700; flex:1; min-width:0}
.card .sub{font-size:11.5px; color:var(--ink-3); margin:2px 0 13px; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:4px; flex:none; align-items:center}
.tbtn{appearance:none; border:1px solid transparent; background:none; color:var(--ink-3); cursor:pointer; width:26px; height:26px;
  border-radius:7px; display:grid; place-items:center; padding:0; transition:.12s}
.tbtn:hover{background:var(--surface-3); color:var(--ink); border-color:var(--line-2)}
.tbtn[aria-pressed="true"]{background:var(--brand-2); color:#fff; border-color:var(--brand-2)}
.tbtn svg{width:15px; height:15px}
.sec-title{font-family:var(--display); font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  margin:30px 0 13px; display:flex; align-items:center; gap:11px}
.sec-title::after{content:''; flex:1; height:1px; background:var(--line)}
.badge{font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:3px 7px;
  border-radius:5px; white-space:nowrap; flex:none; border:1px solid transparent}
.badge.comp{color:var(--good); background:color-mix(in srgb,var(--good) 11%,transparent); border-color:color-mix(in srgb,var(--good) 26%,transparent)}
.badge.harm{color:var(--warn); background:color-mix(in srgb,var(--warn) 12%,transparent); border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.badge.only{color:var(--ink-2); background:var(--surface-3); border-color:var(--line-2)}

/* BARRAS */
.bars{display:flex; flex-direction:column; gap:8px}
.bar-row{display:grid; grid-template-columns:minmax(88px,var(--labw,150px)) 1fr auto; gap:11px; align-items:center; cursor:pointer; border-radius:7px; transition:.1s}
.bar-row:hover{background:var(--surface-2)}
.bar-row .bl{font-size:12.5px; color:var(--ink-2); text-align:right; line-height:1.25; overflow-wrap:anywhere}
.bar-track{background:var(--surface-3); border-radius:5px; height:var(--bh,20px); position:relative; overflow:hidden}
.bar-fill{height:100%; border-radius:0 5px 5px 0; background:var(--bc,var(--c1)); transition:width .45s cubic-bezier(.22,1,.36,1)}
.bar-row .bv{font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; min-width:52px; text-align:right; color:var(--ink)}
.bar-row.dim{opacity:.34}
.bar-row.on .bl{color:var(--ink); font-weight:700}
.bar-track.dual{display:flex; flex-direction:column; gap:2px; background:none; height:auto; overflow:visible}
.bar-track.dual .seg-t{background:var(--surface-3); border-radius:4px; height:13px; overflow:hidden}
.bar-track.dual .seg-t i{display:block; height:100%; border-radius:0 4px 4px 0; transition:width .45s cubic-bezier(.22,1,.36,1)}
.bar-row.dual .bv{min-width:104px; font-size:12px; display:flex; flex-direction:column; gap:2px; line-height:15px}
.bar-row.dual .bv span{font-variant-numeric:tabular-nums}
.bar-row.dual .bv .y1{color:var(--ink-2); font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:12px}
.legend span{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); font-weight:500}
.legend i{width:11px; height:11px; border-radius:3px; flex:none}

/* DONUT */
.donut-wrap{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.donut{flex:none}
.donut circle{cursor:pointer}
.dlist{display:flex; flex-direction:column; gap:8px; flex:1; min-width:132px}
.dlist div{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2); cursor:pointer; border-radius:6px; padding:1px 3px}
.dlist div:hover{background:var(--surface-2)}
.dlist div.dim{opacity:.34}
.dlist div.on{color:var(--ink); font-weight:700}
.dlist i{width:11px; height:11px; border-radius:3px; flex:none}
.dlist b{margin-left:auto; color:var(--ink); font-variant-numeric:tabular-nums; font-size:13px}

/* AVALIAÇÃO */
.rate-scale{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); margin:0 0 8px calc(var(--labw,168px) + 11px); font-variant-numeric:tabular-nums}
.rate-row{display:grid; grid-template-columns:minmax(100px,var(--labw,168px)) 1fr auto; gap:11px; align-items:center}
.rate-row .bl{font-size:12.5px; color:var(--ink-2); text-align:right; line-height:1.25}
.rate-track{background:var(--surface-3); border-radius:5px; height:18px; position:relative; overflow:hidden}
.rate-track .gl{position:absolute; top:0; bottom:0; width:1px; background:var(--line-2); opacity:.75}
.rate-track .fill{height:100%; border-radius:0 5px 5px 0; background:var(--c3)}
.rate-track .prev{position:absolute; top:1px; bottom:1px; width:2px; background:var(--ink); opacity:.55; border-radius:2px}
.rate-row .bv{font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; min-width:78px; text-align:right; display:flex; gap:7px; justify-content:flex-end; align-items:center}
.rate-row .bv em{font-style:normal; font-weight:600; font-size:11.5px}

/* NPS */
.nps-wrap{display:flex; gap:22px; align-items:center; flex-wrap:wrap}
.nps-score{font-size:52px; font-weight:800; letter-spacing:-.03em; line-height:1; color:var(--good)}
.nps-bar{flex:1; min-width:230px}
.nps-stack{display:flex; height:26px; border-radius:6px; overflow:hidden; gap:2px; background:var(--surface-3)}
.nps-stack i{display:block; height:100%}
.nps-leg{display:flex; gap:15px; margin-top:11px; flex-wrap:wrap}
.nps-leg span{font-size:12px; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px}
.nps-leg i{width:11px; height:11px; border-radius:3px}

/* FOCO */
.ovl{position:fixed; inset:0; z-index:200; background:rgba(14,39,53,.55); display:grid; place-items:center; padding:24px}
.ovl-in{background:var(--surface); border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,.3); width:min(1000px,100%);
  max-height:90vh; overflow:auto; padding:24px 26px 26px}
.ovl-in .card{border:0; box-shadow:none; padding:0}
.ovl-close{appearance:none; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); cursor:pointer;
  border-radius:8px; padding:6px 12px; font:inherit; font-size:12.5px; font-weight:700}
.ovl-close:hover{border-color:var(--bad); color:var(--bad)}
.ovl-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px}
.ovl-head b{font-family:var(--display); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:11px; margin:18px 0 0}
table{border-collapse:collapse; width:100%; min-width:420px; font-size:13px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top}
th{background:var(--surface-2); font-family:var(--display); font-weight:700; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:600; color:var(--ink)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}

/* INÍCIO */
/* foto de fundo cobrindo toda a página Início */
#fundo-inicio{position:fixed; inset:0; z-index:0; opacity:0; visibility:hidden; transition:opacity .35s;
  background:#0E2735 center 46% / cover no-repeat; background-attachment:fixed}
#fundo-inicio::after{content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(6,26,40,.30) 0%, rgba(6,26,40,.12) 26%, rgba(6,26,40,.10) 52%, rgba(6,26,40,.34) 74%, rgba(6,26,40,.62) 100%)}
@media(max-width:820px){ #fundo-inicio{background-attachment:scroll; background-position:58% 40%} }
body.inicio #fundo-inicio{opacity:1; visibility:visible}
body.inicio .wrap{position:relative; z-index:1}
body.inicio .nav{background:rgba(255,255,255,.92); backdrop-filter:blur(9px)}

/* Início em uma tela só, sem rolagem, deixando a paisagem à mostra */
@media (min-height:600px){
  body.inicio{height:100dvh; overflow:hidden; display:flex; flex-direction:column}
  body.inicio .nav{flex:none}
  body.inicio #tt, body.inicio #foco, body.inicio #login{flex:none}
  body.inicio .wrap{flex:1; min-height:0; padding-bottom:0; display:flex; flex-direction:column}
  body.inicio #app{flex:1; display:flex; flex-direction:column; min-height:0}
  body.inicio .hero{flex:1; display:flex; flex-direction:column; min-height:0}
  body.inicio .hero-mid{flex:1; min-height:30px}
}
.hero{text-align:center; padding:0 0 40px}
.hero-top{flex:none}
.hero-mid{flex:none; min-height:clamp(150px,22vw,300px)}
.hero-bot{flex:none}
.hero-bar{position:relative; z-index:1; display:inline-flex; align-items:center; gap:20px;
  padding:20px 2px 0; text-align:left}
.hero-chip{background:rgba(255,255,255,.96); border-radius:12px; padding:10px 14px; flex:none;
  box-shadow:0 6px 20px rgba(6,26,40,.34); display:flex; align-items:center}
.hero-chip img{width:clamp(96px,10vw,124px); height:auto; display:block}
.hero .rule{display:flex; align-items:center; gap:14px; margin-bottom:0}
.hero .rule i{height:3px; width:38px; background:var(--brand-2); border-radius:2px; display:block; flex:none}
.hero .rule i:last-child{display:none}
.hero h1{font-size:clamp(16px,2.1vw,24px); font-weight:800; color:#fff; letter-spacing:-.02em; line-height:1.24;
  text-shadow:0 2px 10px rgba(6,26,40,.55)}
.hero-cred{position:absolute; right:2px; top:26px; z-index:2; font-size:10.5px; letter-spacing:.03em;
  color:rgba(255,255,255,.78); text-shadow:0 1px 5px rgba(6,26,40,.85); pointer-events:none}
body.inicio .hero{position:relative}
@media(max-width:720px){
  .hero-foto{min-height:420px}
  .hero-bar{flex-direction:column; align-items:center; text-align:center; gap:16px; padding:20px 16px 22px}
  .hero .rule i:last-child{display:block}
}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:14px; margin:0}
.hcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 13px 15px;
  text-align:center; cursor:pointer; transition:.16s; box-shadow:var(--shadow); position:relative; overflow:hidden}
.hcard::before{content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--hc)}
.hcard:hover{transform:translateY(-3px); border-color:var(--hc)}
.hcard svg{width:38px; height:38px; margin-bottom:12px; color:var(--hc)}
.hcard .t{font-size:12.5px; font-weight:700; line-height:1.3; min-height:2.6em; display:flex; align-items:center; justify-content:center}
.hcard .c{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.09em; color:var(--ink-3); margin-top:11px; padding-top:11px; border-top:1px solid var(--line)}
.hcard.disabled{opacity:.62}
body.inicio .hcard{background:rgba(255,255,255,.94); border-color:rgba(255,255,255,.5);
  box-shadow:0 10px 28px rgba(6,26,40,.30); padding:13px 10px 10px}
body.inicio .hcard.disabled{opacity:.84}
body.inicio .hcard svg{width:27px; height:27px; margin-bottom:7px}
body.inicio .hcard .t{min-height:0; font-size:12px}
body.inicio .hcard .c{margin-top:7px; padding-top:7px; font-size:9.5px}
body.inicio .cards{gap:11px}
body.inicio .foot{margin-top:14px; padding:12px 24px; gap:clamp(20px,4vw,46px);
  background:rgba(255,255,255,.94); border-color:rgba(255,255,255,.5); box-shadow:0 10px 28px rgba(6,26,40,.30)}
body.inicio .foot img{max-height:38px; width:auto; height:auto}
body.inicio .tiny{color:rgba(255,255,255,.9); text-shadow:0 1px 5px rgba(6,26,40,.75);
  margin-top:11px; line-height:1.6; padding:0 clamp(0px,3vw,40px)}
body.inicio .hero{padding-bottom:16px}
@media (max-width:720px){
  body.inicio .hero-bar{flex-direction:row; align-items:center; text-align:left; gap:14px; padding:14px 0 0}
  body.inicio .hero .rule i:last-child{display:none}
  body.inicio .hero-chip{padding:8px 11px}
  body.inicio .hero-chip img{width:86px}
  body.inicio .hero h1{font-size:15px; line-height:1.25}
  body.inicio .cards{grid-template-columns:1fr 1fr; gap:9px}
  body.inicio .hcard{padding:11px 8px 8px}
  body.inicio .hcard svg{width:23px; height:23px; margin-bottom:5px}
  body.inicio .hcard .t{font-size:11.5px}
  body.inicio .foot{margin-top:10px; padding:9px 14px; gap:16px}
  body.inicio .foot img{max-height:28px}
  body.inicio .tiny{margin-top:8px; font-size:10px; line-height:1.45; padding:0}

function dist(f, rows){
  rows = rows || linhas(f);
  const c=new Map();
  rows.forEach(r=>{ const v=lab(f,r[CI[f]]); if(v) c.set(v,(c.get(v)||0)+1); });
  let it=[...c.entries()];
  if(ORDENADOS.has(f)) it.sort((a,b)=>DIC[f].indexOf(a[0])-DIC[f].indexOf(b[0]));
  else it.sort((a,b)=>b[1]-a[1]);
  const tot=it.reduce((s,x)=>s+x[1],0);
  return {campo:f,total:tot,labels:it.map(x=>x[0]),values:it.map(x=>x[1]),
          pct:it.map(x=> tot? +(100*x[1]/tot).toFixed(1):0)};
}
function dist2(f){
  const rows=linhas(f);
  const A=dist(f,rows.filter(r=>r[0]===2025)), B=dist(f,rows.filter(r=>r[0]===2026));
  const ordem = ORDENADOS.has(f) ? DIC[f].filter(v=>A.labels.includes(v)||B.labels.includes(v))
    : [...new Set([...B.labels,...A.labels])];
  const mA=new Map(A.labels.map((l,i)=>[l,A.pct[i]])), mB=new Map(B.labels.map((l,i)=>[l,B.pct[i]]));
  const cA=new Map(A.labels.map((l,i)=>[l,A.values[i]])), cB=new Map(B.labels.map((l,i)=>[l,B.values[i]]));
  return {campo:f, labels:ordem, a:ordem.map(l=>mA.has(l)?mA.get(l):null), b:ordem.map(l=>mB.has(l)?mB.get(l):null),
          na:A.total, nb:B.total, va:ordem.map(l=>cA.get(l)||0), vb:ordem.map(l=>cB.get(l)||0)};
}

}

      if(x.v.tipo==='mv') temMV=true;

  if(!temNps){ const i=CI2['nps']; M.rows.forEach(r=>{ r[i]=null; }); }
  if(!temGasto){ const i=CI2['gval']; M.rows.forEach(r=>{ r[i]=null; }); }

  const est={modoPublico:true, priv:JSON.parse(JSON.stringify(PRIV))};

  const tag=(id,obj)=>'<script type="application/json" id="'+id+'">'+JSON.stringify(obj).replace(/<\//g,'<\\/')+'<\/script>\n';
  let app=document.getElementById('app-script').textContent;
  app=app.replace(/senhaHash:\s*'[^']*'/, "senhaHash: ''");
  const html=cabeca+corpo+tag('dados-micro',M)+tag('dados-mapas',MAPAS)+tag('dados-logos',LOGOS)+tag('dados-estado',est)+
    '<script id="app-script">'+app.replace(/<\//g,'<\\/')+'<\/script>\n</body>\n</html>';
  const a=document.createElement('a');

  a.download='Plataforma_NPDT_publica.html'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);

function badge(t){
  if(t==='comp') return '<span class="badge comp" data-tip="Mesma pergunta e mesmas opções nas duas ondas.">Comparável</span>';
  if(t==='harm') return '<span class="badge harm" data-tip="Mesmo conceito, opções diferentes entre 2025 e 2026. Comparação em categorias agrupadas.">Harmonizado</span>';
  return '<span class="badge only" data-tip="Indicador inexistente na pesquisa de 2025.">Só 2026</span>';

function delta(a,b){
  if(a==null||b==null) return '';
  const d=b-a, s=Math.abs(d)<0.5?'flat':(d>0?'up':'down'), ar=Math.abs(d)<0.5?'→':(d>0?'▲':'▼');
  return '<span class="delta '+s+'">'+ar+' '+DEC(Math.abs(d),1)+' p.p.</span>';
}

  its.map(a=>{

function distMV(rows){
  const c=new Array(MVOPC.length).fill(0); let base=0;
  rows.forEach(r=>{ const a=MV[r.i]; if(a&&a.length){ base++; a.forEach(k=>c[k]++); } });
  const it=MVOPC.map((l,i)=>[l,c[i]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  return {campo:'mv', total:base, labels:it.map(x=>x[0]), values:it.map(x=>x[1]),
          pct:it.map(x=> base? +(100*x[1]/base).toFixed(1):0)};
}

/* ---- variação por item: 2025 -> 2026 (dumbbell) ---- */
function nomeCurto(t){
  return t.replace(' regional (JJD)','').replace(' e gastronomia','')
          .replace('Transporte turístico local','Transporte turístico')
          .replace('Experiência de chegada','Experiência de chegada')
          .replace('Internet / Wi-Fi','Internet / Wi-Fi');
}
function chartArcos(){
  const rows=linhas(null), c=S.comparar;
  const rB = c? rows.filter(r=>r[0]===2026) : rows;
  const rA = rows.filter(r=>r[0]===2025);
  const mB=medias(rB), mA=medias(rA);
  const dois = c && rA.length>0 && rB.length>0;
  let it=AVLAB.map((t,i)=>({item:t, b:mB[i].media, a:(mA[i]?mA[i].media:null)})).filter(x=>x.b!=null);
  if(!it.length) return '<p class="empty">Nenhuma avaliação com os filtros atuais.</p>';
  it.sort((p,q)=>q.b-p.b);
  const mg = it.reduce((s0,x)=>s0+x.b,0)/it.length;
  const lo=it[it.length-1].b, hi=it[0].b;
  const aP=Math.max(0.001,hi-mg), aN=Math.max(0.001,mg-lo);
  /* rampa divergente: laranja (pior) → verde (melhor), ancorada na média geral do recorte */
  const nvl=v=>{ const t=(v>=mg)?(v-mg)/aP:(v-mg)/aN; return Math.min(4,Math.max(0,Math.round(t*2)+2)); };
  const W=940, cols=5, CW=W/cols, CH=dois?152:132, lin=Math.ceil(it.length/cols), H=lin*CH+6;
  let g='';
  it.forEach((x,i)=>{
    const cx=(i%cols)*CW+CW/2, cy=Math.floor(i/cols)*CH+74, R=44;
    const arco=(a0,a1,cor,w)=>{
      const p0=[cx+R*Math.cos(a0), cy-R*Math.sin(a0)], p1=[cx+R*Math.cos(a1), cy-R*Math.sin(a1)];
      return '<path d="M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+R+' '+R+' 0 0 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+
             '" fill="none" stroke="'+cor+'" stroke-width="11" stroke-linecap="round"/>';
    };
    const k=nvl(x.b), arc=DIVA[k], tx=DIVT[k];
    const ang=Math.PI*(1-(x.b-1)/4);
    g+='<g data-tip="'+esc(x.item)+' — '+DEC(x.b)+' de 5'+(x.a!=null?' (2025: '+DEC(x.a)+')':'')+'">'+
       arco(Math.PI,0,'#E8EEF2',11)+arco(Math.PI,ang,arc,11);
    if(dois && x.a!=null){ const aa=Math.PI*(1-(x.a-1)/4);
      const p=[cx+(R+9)*Math.cos(aa), cy-(R+9)*Math.sin(aa)], q=[cx+(R-9)*Math.cos(aa), cy-(R-9)*Math.sin(aa)];
      g+='<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+
         '" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>'; }
    g+='<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="22" font-weight="800" font-family="Archivo,sans-serif" fill="'+tx+'">'+DEC(x.b)+'</text>'+
       '<text x="'+cx+'" y="'+(cy+21)+'" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Sans,sans-serif">'+esc(nomeCurto(x.item))+'</text>';
    if(dois){ const d = x.a!=null? +(x.b-x.a).toFixed(2) : null;
      g+='<text x="'+cx+'" y="'+(cy+39)+'" text-anchor="middle" font-size="11.5" font-weight="700" font-family="Archivo,sans-serif" fill="'+
         (d==null?'var(--ink-3)':(d>0?'#23663F':(d<0?'#A34E06':'var(--ink-3)')))+'">'+
         (d==null?'novo em 2026':(d>0?'▲ +':(d<0?'▼ −':'= '))+(d==null?'':DEC(Math.abs(d))))+'</text>'; }
    g+='</g>';
  });
  const leg='<div class="legend"><span>pior avaliado</span>'+DIVA.map(cc=>'<i style="background:'+cc+'"></i>').join('')+
    '<span>melhor avaliado</span>'+(dois?'<span><i style="background:var(--ink);width:3px;height:13px;border-radius:1px"></i>posição em 2025</span>':'')+'</div>';
  return '<div class="viz-top">'+leg+'</div>'+
    '<div class="svg-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mostradores da nota média de cada item avaliado">'+g+'</svg></div>'+
    '<p class="sub" style="margin:10px 0 0">O arco preenche a escala de 1 a 5. A cor compara o item com a média geral do recorte: verde para quem está acima, laranja para quem está abaixo.'+
    (dois?' O traço escuro marca onde o item estava em 2025.':'')+'</p>';
}

const SEGNPS={org:'Tipo de visitante', reg:'Região de origem'};
function chartNpsSeg(){
  const campo = SEGNPS[S.npsSegCampo]? S.npsSegCampo : 'org';
  const rows=linhas(null).filter(r=>r[CI.nps]!=null);
  const botoes='<div class="viz-esc">'+Object.keys(SEGNPS).map(k=>
    '<button class="chip sm" data-npsseg="'+k+'" aria-pressed="'+(k===campo)+'">'+SEGNPS[k]+'</button>').join('')+'</div>';
  if(!rows.length) return '<div class="viz-top">'+botoes+'</div><p class="empty">A pergunta de recomendação só existe em 2026. Selecione 2026 para ver este visual.</p>';
  const S2=[];
  DIC[campo].forEach((lab,j)=>{
    const v=rows.filter(r=>r[CI[campo]]===j).map(r=>r[CI.nps]);
    if(v.length<25) return;
    const pr=v.filter(x=>x>=9).length, de=v.filter(x=>x<=6).length;
    S2.push({lab:lab, prom:100*pr/v.length, neu:100*(v.length-pr-de)/v.length, det:100*de/v.length});
  });

/* ---- nuvem de palavras dos temas ---- */
function nuvemLayout(T, base, W, H, escala){
  const mx=T[0][1], mn=T[T.length-1][1];
  const put=[];
  const cx=W/2, cy=H/2;
  for(let i=0;i<T.length;i++){
    const f = escala*(19 + 32*Math.sqrt((T[i][1]-mn)/Math.max(1,mx-mn)));
    const w = T[i][0].length*f*0.505, h=f*1.16;
    let ok=null;
    for(let a=0;a<2600;a++){
      const ang=a*0.35, rad=2.0*Math.sqrt(a)*2.2;
      const x=cx+rad*Math.cos(ang)*1.60, y=cy+rad*Math.sin(ang)*0.78;
      const r={x0:x-w/2-7, x1:x+w/2+7, y0:y-h/2-5, y1:y+h/2+5, x:x, y:y};
      if(r.x0<6||r.x1>W-6||r.y0<6||r.y1>H-6) continue;
      let livre=true;
      for(let q=0;q<put.length;q++){ const o=put[q];
        if(!(r.x1<o.x0||r.x0>o.x1||r.y1<o.y0||r.y0>o.y1)){ livre=false; break; } }
      if(livre){ ok=r; break; }
    }
    if(!ok) return null;
    ok.t=T[i]; ok.f=f; ok.i=i;
    put.push(ok);
  }
  return put;
}
function chartNuvem(){
  const T=(MICRO.temasof||[]).slice().sort((a,b)=>b[1]-a[1]), base=MICRO.basesug||0;
  if(!T.length||!base) return '<p class="empty">Sem sugestões classificadas.</p>';
  const W=920,H=340;
  let put=null;
  for(let e=1; e>0.45 && !put; e-=0.07) put=nuvemLayout(T,base,W,H,e);
  if(!put) return chartTemasBarras();
  const n=T.length;
  const g=put.map(o=>{
    const p=100*o.t[1]/base;
    const cor=SETUR[o.i%4][o.f>=34?0:1];
    return '<text x="'+o.x.toFixed(1)+'" y="'+(o.y+o.f*0.35).toFixed(1)+'" text-anchor="middle" font-size="'+o.f.toFixed(1)+'"'+
      ' font-weight="'+(o.i<3?'800':(o.i<7?'700':'600'))+'" fill="'+cor+'" font-family="Archivo,sans-serif"'+
      ' data-tip="'+esc(o.t[0])+': '+PC(p)+' de quem escreveu">'+esc(o.t[0])+'</text>';
  }).join('');
  return '<div class="svg-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Nuvem dos temas das sugestões">'+g+'</svg></div>';
}

function corpo(v){
  if(v.tipo==='nps') return chartNps(npsDe(linhas(null)));
  if(v.tipo==='mapabr') return chartMapaBR(dist('reg'));
  if(v.tipo==='mapauf') return chartMapaUF(dist('uf'));
  if(v.tipo==='mundo') return chartMapaMundo(dist('intl'));
  if(v.tipo==='mv') return chartMV(linhas(null), v);
  if(v.tipo==='stack') return chartStack();
  if(v.tipo==='arcos') return chartArcos();
  if(v.tipo==='npsseg') return chartNpsSeg();
  if(v.tipo==='gastorenda') return chartGastoRenda();
  if(v.tipo==='temas') return chartTemas();
  if(v.tipo==='npsdist') return chartNpsDist();
  if(v.tipo==='rate'){
    const rows=linhas(null);
    if(S.comparar) return chartRate(medias(rows.filter(r=>r[0]===2026)), medias(rows.filter(r=>r[0]===2025)));
    return chartRate(medias(rows), null);
  }
  const f=campoEfetivo(v.campo);
  if(S.comparar && v.comparavel!==false) return chartBar2(dist2(f),v);
  const d=dist(f);
  if(v.tipo==='donut')    return chartDonut(d);
  if(v.tipo==='lolli')    return chartLolli(d,v);
  if(v.tipo==='stack100') return chartStack100(d);
  if(v.tipo==='colunas')  return chartColunas(d,v);
  if(v.tipo==='funil')    return chartFunil(d);
  if(v.tipo==='picto')    return chartPicto(d,v);
  return chartBar(d,v);
}
function subtitulo(v){
  if(['nps','rate','mapabr','mapauf','mundo','mv','stack','npsdist','temas','arcos','npsseg','gastorenda'].indexOf(v.tipo)>=0) return v.sub||'';
  const f=campoEfetivo(v.campo);
  if(S.comparar && v.comparavel!==false) return (v.sub?v.sub+' · ':'')+'Percentual calculado dentro de cada ano';
  return v.sub||'';
}
function cardVis(v,foco){
  VIS[v.id]=v;

    '<header><h3>'+v.tit+'</h3>'+(v.badge?badge(v.badge):'')+(foco?'':seletor('blocos',v.id))+tools+'</header>'+

function tabelaSetas(){
  const rows=linhas(null);
  const r25=rows.filter(r=>r[0]===2025), r26=rows.filter(r=>r[0]===2026);
  const m25=medias(r25), m26=medias(r26), dois=r25.length>0&&r26.length>0;
  let it=AVLAB.map((t,i)=>({item:t,a:m25[i].media,b:m26[i].media}));
  it = dois ? it.filter(x=>x.a!=null&&x.b!=null) : it.map(x=>({item:x.item,a:null,b:(x.b!=null?x.b:x.a)})).filter(x=>x.b!=null);
  if(!it.length) return '';
  it.forEach(x=>{ x.d=(x.a!=null)?+(x.b-x.a).toFixed(2):null; });
  it.sort(dois?(p,q)=>q.d-p.d:(p,q)=>q.b-p.b);
  return '<div class="tblwrap"><table><thead><tr><th>Item</th>'+(dois?'<th class="num">2025</th>':'')+
    '<th class="num">'+(dois?'2026':'Nota média')+'</th>'+(dois?'<th class="num">Variação</th>':'')+'</tr></thead><tbody>'+
    it.map(x=>'<tr><td>'+esc(x.item)+'</td>'+(dois?'<td class="num">'+DEC(x.a)+'</td>':'')+
      '<td class="num">'+DEC(x.b)+'</td>'+(dois?'<td class="num">'+(x.d>0?'+':(x.d<0?'−':''))+DEC(Math.abs(x.d))+'</td>':'')+'</tr>').join('')+
    '</tbody></table></div>';
}
function tabelaDe(v){
  if(v.tipo==='temas') return textosSug();
  if(['nps','mv','stack','npsdist','npsseg','gastorenda'].indexOf(v.tipo)>=0) return '';
  if(v.tipo==='arcos') return tabelaSetas();
  if(v.tipo==='mapabr') v={campo:'reg'};
  if(v.tipo==='mapauf') v={campo:'uf'};
  if(v.tipo==='mundo') v={campo:'intl'};
  if(v.tipo==='rate'){
    const rows=linhas(null), at=medias(S.comparar?rows.filter(r=>r[0]===2026):rows);
    const pv=S.comparar?new Map(medias(rows.filter(r=>r[0]===2025)).map(a=>[a.item,a.media])):null;
    return '<div class="tblwrap"><table><thead><tr><th>Item</th><th class="num">Média</th>'+(pv?'<th class="num">2025</th>':'')+'</tr></thead><tbody>'+
      at.filter(a=>a.media!=null).sort((a,b)=>b.media-a.media).map(a=>'<tr><td>'+esc(a.item)+'</td><td class="num">'+DEC(a.media)+'</td>'+(pv?'<td class="num">'+(pv.get(a.item)!=null?DEC(pv.get(a.item)):'—')+'</td>':'')+'</tr>').join('')+
      '</tbody></table></div>';
  }
  const f=campoEfetivo(v.campo);
  if(S.comparar && v.comparavel!==false){
    const d=dist2(f);
    return '<div class="tblwrap"><table><thead><tr><th>Categoria</th><th class="num">2025</th><th class="num">2026</th></tr></thead><tbody>'+
      d.labels.map((l,i)=>'<tr><td>'+esc(l)+'</td><td class="num">'+(d.a[i]==null?'—':PC(d.a[i]))+'</td><td class="num">'+(d.b[i]==null?'—':PC(d.b[i]))+'</td></tr>').join('')+
      '</tbody></table></div>';
  }
  const d=dist(f);
  return '<div class="tblwrap"><table><thead><tr><th>Categoria</th><th class="num">Percentual</th></tr></thead><tbody>'+
    d.labels.map((l,i)=>'<tr><td>'+esc(l)+'</td><td class="num">'+PC(d.pct[i])+'</td></tr>').join('')+
    '</tbody></table></div>';
}

function phead(p){
  return '<div class="phead" style="--tabc:'+p.cor+'"><div class="pt"><div class="accentbar"></div><h2>'+p.nome+'</h2></div>'+
    seletor('abas',p.id, ehPriv('abas',p.id)?'Aba privada':'Aba pública')+'</div>';
}
function secao(sec){
  if(!verVisivel('secoes',sec.id)) return '';
  const vis=sec.visuais.filter(v=>verVisivel('blocos',v.id));
  if(!vis.length) return '';
  const p=ADM&&ehPriv('secoes',sec.id);
  const tit = sec.titulo ? '<div class="sec-title'+(p?' privado':'')+'">'+sec.titulo+seletor('secoes',sec.id, p?'Seção privada':'Seção pública')+'</div>' : '';
  let out='', buf=[];
  const flush=()=>{ if(buf.length){ out+='<div class="grid g2">'+buf.join('')+'</div>'; buf=[]; } };
  vis.forEach(v=>{ if(v.full){ flush(); out+='<div class="grid">'+cardVis(v)+'</div>'; }
                   else { buf.push(cardVis(v)); if(buf.length===2) flush(); } });
  flush();
  return tit+out;
}
function blocoKpis(id, html){
  if(!verVisivel('blocos',id)) return '';
  if(!ADM) return html;
  return '<div style="position:relative">'+(ehPriv('blocos',id)?'<span class="badge-priv" style="top:-8px;right:8px">PRIVADO</span>':'')+
    '<div style="display:flex;justify-content:flex-end;margin-bottom:-6px">'+seletor('blocos',id)+'</div>'+html+'</div>';
}

function rodape(modo){
  if(modo===true) modo='inicio';
  const e1=CONFIG.escalaLogosRodape||0.78;
  const alt=v=>Math.round(v*e1);
  const pref=CONFIG.logoPrefeitura||LOGOS.prefeitura;
  const mkNpdt='<img src="'+LOGOS.npdt+'" alt="Núcleo de Pesquisa e Dados Turísticos" style="height:'+alt(CONFIG.alturaLogoNpdt)+'px">';
  const mkSetur='<img src="'+LOGOS.setur+'" alt="Secretaria Municipal de Turismo" style="height:'+alt(CONFIG.alturaLogoSetur)+'px">';
  const mkPref=pref?'<img src="'+pref+'" alt="Prefeitura Municipal de Jijoca de Jericoacoara" style="height:'+alt(CONFIG.alturaLogoPrefeitura)+'px">':'';
  /* grupo de realização: Secretaria de Turismo + Prefeitura (sem o NPDT, que já aparece
     em "Fonte" e "Desenvolvido por") */
  const trio=mkSetur+mkPref;
  const grp=(rot,conteudo)=>'<div class="fgrp"><span class="flab">'+rot+'</span><div class="fmarcas">'+conteudo+'</div></div>';
  const div='<span class="fdiv"></span>';
  let blocos;
  if(modo==='inicio')
    blocos=[grp('Realizado por:',trio), grp('Desenvolvido por:',mkNpdt)];
  else if(modo==='notas')
    blocos=[grp('Realização:',trio), grp('Desenvolvido por:',mkNpdt)];
  else
    blocos=[grp('Fonte:',mkNpdt), grp('Desenvolvido por:',mkNpdt), grp('Realização:',trio),
            grp('Atualizado em:','<span class="fdata">'+CONFIG.atualizadoEm+'</span>')];
  const texto = modo==='inicio'
    ? '<p class="tiny just" style="--tsz:'+CONFIG.tamanhoTextoInicio+'px">'+CONFIG.textoInicio+'</p>'
    : '<p class="tiny" style="--tsz:'+CONFIG.tamanhoRodapeTexto+'px">'+CONFIG.rodapeTexto+'</p>';
  return '<div class="foot">'+blocos.join(div)+'</div>'+texto;
}

           sub:S.comparar?'Escala de 1 a 5. O traço cinza marca 2025':'Escala de 1 (péssimo) a 5 (ótimo)'}
  };
  const sec=[];
  sec.push({id:'sd-origem', titulo:'Origem do visitante',
    visuais: so26 ? [V.org,V.reg,V.uf,V.intl,V.pais,V.cid,V.idi] : [V.org,V.reg]});
  sec.push({id:'sd-perfil', titulo:'Perfil do visitante',
    visuais: so26 ? [V.gen,V.ec,V.fx,V.esc,V.ocp,V.rnd,Object.assign({},V.gxr,{full:true})]
                  : [V.gen,V.ec,V.fx,V.esc,V.ocp,V.rnd]});
  sec.push({id:'sd-viagem', titulo:'Características da viagem', visuais:[V.mot,V.cq,V.pv,V.qv,V.est,V.hsp]});
  sec.push({id:'sd-gasto', titulo:'Gasto e satisfação',
    visuais: so26 ? [V.gst,V.nps,Object.assign({},V.nseg,{full:true})]
                  : [V.gst,V.nps]});
  sec.push({id:'sd-logistica', titulo:'Logística e coleta', visuais:[V.tra,V.mv,V.guia,V.loc]});
  sec.push({id:'sd-aval', titulo:'Avaliação da infraestrutura e dos serviços',
    visuais:[Object.assign({},V.arcos,{full:true}), Object.assign({},V.dist,{full:true})]});
  if(so26) sec.push({id:'sd-sug', titulo:'O que o visitante pediu', visuais:[Object.assign({},V.sug,{full:true})]});
  return sec;
}
function pgDemanda(){
  const rows=linhas(null), c=S.comparar;
  const r26=c?rows.filter(r=>r[0]===2026):rows, r25=rows.filter(r=>r[0]===2025);
  const gm=gastoMedio(r26);
  const p=(f,l,rs)=>pctDe(dist(f,rs||r26),l);
  const kpis='<div class="kpis">'+
    '<div class="kpi" style="--kc:var(--c1)"><div class="k-lab">Viajando acompanhado</div><div class="k-val">'+PC(p('cqa','Acompanhado(a)'))+'</div>'+
      (c?delta(p('cqa','Acompanhado(a)',r25),p('cqa','Acompanhado(a)')):'')+'</div>'+
    '<div class="kpi" style="--kc:var(--c3)"><div class="k-lab">Motivo férias / lazer</div><div class="k-val">'+PC(p('mot','Férias, lazer, sol e praia'))+'</div>'+
      (c?delta(p('mot','Férias, lazer, sol e praia',r25),p('mot','Férias, lazer, sol e praia')):'')+'</div>'+
    '<div class="kpi" style="--kc:var(--c4)"><div class="k-lab">Chegaram de avião</div><div class="k-val">'+PC(p('tra','Avião'))+'</div>'+
      (c?delta(p('tra','Avião',r25),p('tra','Avião')):'')+'</div>'+
    '<div class="kpi" style="--kc:var(--c5)"><div class="k-lab">Gasto médio diário</div><div class="k-val">'+(gm?RS(gm.media):'—')+'</div>'+
      '<div class="k-sub">'+(gm?'em reais, por pessoa':'não medido em 2025')+'</div></div></div>';
  return phead(PG.demanda)+slicers()+blocoKpis('kpi-demanda',kpis)+defsDemanda().map(secao).join('')+rodape('painel');
}

function pgPlaceholder(p,itens,fontes){
  return phead(p)+'<div class="ph">'+ic(p.icon)+
    '<h3>Aba estruturada, aguardando dados</h3>'+
    '<p>O layout e os indicadores desta aba já estão definidos. Ela passa a exibir resultados assim que as bases correspondentes forem incorporadas ao acervo do NPDT.</p>'+
    '<div class="needs">'+itens.map(i=>'<div class="need"><b>'+i[0]+'</b><span>'+i[1]+'</span></div>').join('')+'</div>'+
    '<p class="tiny" style="margin-top:26px"><b>Base necessária:</b> '+fontes+'</p></div>'+rodape('notas');
}

function pgNotas(){
  const L=[
    ['Gênero','Comparável','Mesma pergunta; 2026 acrescentou “prefere não responder” e “não-binário”.'],
    ['Primeira visita','Comparável','Idêntica nas duas ondas.'],
    ['Tempo de permanência','Comparável','Mesmas cinco faixas.'],
    ['Local de aplicação','Comparável','Mesmos pontos de coleta.'],
    ['Origem do visitante','Harmonizado','2025 registrava apenas nacional e regional. A categoria internacional só existe em 2026, quando o questionário passou a ser trilíngue.'],
    ['Região de origem','Harmonizado','2025 coletava a macrorregião; 2026 coleta a unidade da federação, agregada aqui em macrorregião. O rótulo “Suldeste” de 2025 foi corrigido.'],
    ['Faixa etária','Harmonizado','As faixas mudaram (18–25/25–35/… em 2025; 18–24/25–34/… em 2026) e os limites de 2025 se sobrepõem. A comparação só é feita em três blocos amplos.'],
    ['Escolaridade','Harmonizado','“Pós-graduação” (2025) equivale a “pós-graduado/mestrado/doutorado” (2026). 2026 acrescentou curso técnico.'],
    ['Renda mensal','Harmonizado','Faixas diferentes e salário mínimo diferente em cada ano. Comparação em três blocos amplos, nunca em valores absolutos.'],
    ['Com quem viaja','Harmonizado','2025 oferecia apenas sozinho ou acompanhado; 2026 detalha a composição do grupo. Comparação só no nível agregado — o detalhe está no drill down.'],
    ['Motivo da viagem','Harmonizado','Categorias majoritariamente coincidentes; 2025 tinha “científico e estudo” e “em trânsito”, 2026 tem “casamento”.'],
    ['Meio de hospedagem','Harmonizado','2025 tinha “camping/motorhome” e “albergue”; 2026 tem “hostel/albergue” e “casa/apto alugado (Airbnb/Booking)”.'],
    ['Transporte até o município','Harmonizado','2025 registrava “avião” de forma única; 2026 separa desembarque em Jericoacoara (JJD) e em Fortaleza (FOR). A comparação agrupa os dois; o detalhe está no drill down.'],
    ['Avaliação da infraestrutura','Harmonizado','Mesma escala de cinco pontos e 13 itens em comum. Só em 2025: receptividade e fluidez do trânsito. Só em 2026: saúde pública e atrativos naturais.'],
    ['Estado civil','Harmonizado','2025 separava “casado” de “união estável”; 2026 traz as duas juntas. Somadas aqui numa só categoria.'],
    ['Ocupação','Harmonizado','As listas de opções mudaram. “Empregado CLT” (2025) e “trabalhador do setor privado” (2026) foram unificados; “trabalhador sem registro” só existe em 2025.'],
    ['Quantas vezes já visitou','Comparável','Mesmas quatro faixas. Pergunta feita apenas a quem já havia visitado.'],
    ['Meio de acesso à Vila','Não comparável','Em 2025 a pergunta admitia várias respostas por pessoa e em 2026 admite uma só. Exibido separadamente, sem comparação; em 2025 a soma passa de 100%.'],
    ['Uso de guia condutor','Só 2026','Pergunta inexistente em 2025, feita apenas a quem fez a travessia por conta própria.'],
    ['Origem internacional','Só 2026','A pergunta de 2025 não previa a categoria internacional.'],
    ['Gasto diário estimado','Só 2026','Pergunta inexistente em 2025.'],
    ['Recomendação (NPS)','Só 2026','Pergunta inexistente em 2025.'],
    ['Estado de origem (UF)','Só 2026','2025 coletava apenas a macrorregião.'],
    ['Cidade de origem (CE)','Só 2026','A cidade dos turistas regionais só passou a ser coletada em 2026.'],
    ['Idioma da resposta','Só 2026','O questionário só se tornou trilíngue em 2026.'],
    ['Sugestões de melhoria','Só 2026','Pergunta aberta inexistente em 2025.']
  ];
  const cls=t=>t==='Comparável'?'comp':(t==='Harmonizado'?'harm':'only');
  return phead(PG.notas)+
  '<div class="grid g3">'+
    '<div class="card"><header><h3>Pesquisa de Demanda — 2025</h3></header>'+
      '<p class="sub" style="margin-top:6px">Coleta ao longo de todo o mês de julho de 2025.</p></div>'+
    '<div class="card"><header><h3>Pesquisa de Demanda — 2026</h3></header>'+
      '<p class="sub" style="margin-top:6px">Coleta ao longo de todo o mês de julho de 2026.</p></div>'+
    '<div class="card"><header><h3>Como usar os filtros</h3></header>'+
      '<p class="sub" style="margin-top:6px">Clique em qualquer barra ou fatia para filtrar toda a página por aquela categoria. Use os seletores de ano e mês no topo, o botão de foco para ampliar um gráfico com a tabela de dados, e a seta para detalhar as hierarquias.</p></div>'+
  '</div>'+
  '<div class="card prose" style="margin-top:16px">'+
    '<h3 style="margin-top:0">Comparabilidade entre 2025 e 2026</h3>'+
    '<p>Cada indicador está classificado em uma de três situações, sinalizada por um selo ao lado do gráfico.</p>'+
    '<p><b>Base de 2026.</b> A plataforma usa o banco de dados tratado do relatório analítico de julho de 2026, com 440 registros. Todos os indicadores de 2026 foram conferidos contra o relatório.</p>'+
    '<p><b>Sobre as bases.</b> A onda de 2025 correu inteira dentro de julho. A de 2026 é contínua desde maio, e julho concentra a maior parte das respostas. Por isso, ao ativar “Comparar anos”, a plataforma parte de julho: é a única leitura de mês contra mês equivalente. A planilha analítica do NPDT para julho de 2026 considera o acumulado até 31 de julho, recorte que os seletores de mês reproduzem.</p>'+
    '<ul><li><b>Comparável</b> — mesma pergunta e mesmas opções: a variação é leitura direta.</li>'+
    '<li><b>Harmonizado</b> — mesmo conceito, redação ou opções diferentes: a comparação é feita em categorias agrupadas, nunca no nível detalhado.</li>'+
    '<li><b>Só 2026</b> — indicador inexistente em 2025: exibido sem variação.</li></ul>'+
    '<div class="tblwrap"><table><thead><tr><th style="width:22%">Indicador</th><th style="width:16%">Situação</th><th>Observação metodológica</th></tr></thead><tbody>'+
      L.map(l=>'<tr><td>'+l[0]+'</td><td><span class="badge '+cls(l[1])+'">'+l[1]+'</span></td><td style="color:var(--ink-2)">'+l[2]+'</td></tr>').join('')+
    '</tbody></table></div>'+
    '<h3>Critérios de cálculo</h3><ul>'+
      '<li><b>Gasto médio diário.</b> Média ponderada pelos pontos médios das faixas. Excluídos os que preferiram não responder e as respostas em dólar, para não misturar moedas.</li>'+
      '<li><b>Avaliação da infraestrutura.</b> Péssimo 1, ruim 2, regular 3, bom 4, ótimo 5. Quem marcou “não utilizei / não sei avaliar” fica fora da média do item.</li>'+
      '<li><b>NPS.</b> Percentual de promotores (9 e 10) menos percentual de detratores (0 a 6). Varia de −100 a +100.</li>'+
      '<li><b>Consolidação de idiomas.</b> Cada resposta preenche apenas o bloco do idioma escolhido. As três versões são unificadas antes de qualquer cálculo, incluindo o bloco de inglês duplicado na planilha em 21/08/2026.</li>'+
      '<li><b>Percentuais.</b> Sobre o total de respostas válidas de cada pergunta, não sobre o total de questionários. Perguntas não obrigatórias têm base menor, o que é normal.</li>'+
      '<li><b>Filtro cruzado.</b> Ao clicar numa categoria, todos os demais visuais passam a considerar apenas as respostas daquele grupo. O gráfico clicado continua mostrando todas as categorias, com a selecionada em destaque.</li>'+
    '</ul>'+
  '</div>'+rodape('notas');
}

/* ============ RENDER ============ */
function render(){
  const VIS_PAGES=PAGES.filter(x=>verVisivel('abas',x.id));
  if(S.page!=='abertura' && !VIS_PAGES.some(x=>x.id===S.page)) S.page='abertura';
  document.getElementById('tabs').innerHTML=
    '<button class="tab" data-go="abertura" style="--tabc:var(--brand-2)" aria-current="'+(S.page==='abertura')+'">'+
      '<span class="dot" style="background:var(--brand-2)"></span>Início</button>'+
    VIS_PAGES.map(x=>'<button class="tab" data-go="'+x.id+'" style="--tabc:'+x.cor+'" aria-current="'+(x.id===S.page)+'">'+
      '<span class="dot" style="background:'+x.cor+'"></span>'+x.nome+(x.pronto?'':'<span class="soon">EM BREVE</span>')+'</button>').join('');
  let h;
  if(S.page==='visao') h=pgVisao();
  else if(S.page==='demanda') h=pgDemanda();
  else if(S.page==='notas') h=pgNotas();
  else if(S.page==='aereo') h=pgPlaceholder(PG.aereo,
    [['Passageiros por mês','Embarques e desembarques, série mensal comparada 2025 × 2026.'],
     ['Taxa de ocupação dos voos','Assentos ofertados contra passageiros transportados.'],
     ['Sazonalidade','Distribuição do fluxo ao longo do ano e identificação de picos.'],
     ['Origem das aeronaves','Principais rotas e aeroportos de origem.'],
     ['Aéreo × pesquisa','Cruzamento entre fluxo aéreo e perfil de quem chega de avião.']],
    'listas de voos de embarque e desembarque de 2025 e de 2026.');
  else h=pgAbertura();
  document.body.classList.toggle('inicio', S.page==='abertura');
  const fd=document.getElementById('fundo-inicio');
  if(fd && !fd.dataset.pronto && LOGOS.fundo){ fd.style.backgroundImage='url('+LOGOS.fundo+')'; fd.dataset.pronto='1'; }
  document.getElementById('app').innerHTML=barraAdmin()+h;
  renderFoco();
}
function renderFoco(){
  const el=document.getElementById('foco');
  if(!S.foco||!VIS[S.foco]){ el.innerHTML=''; document.body.style.overflow=''; return; }
  el.innerHTML='<div class="ovl" data-ovl="1"><div class="ovl-in" role="dialog" aria-modal="true">'+
    '<div class="ovl-head"><b>Modo de foco</b><button class="ovl-close" data-closefoco="1">Fechar ✕</button></div>'+
    cardVis(VIS[S.foco],true)+'</div></div>';
  document.body.style.overflow='hidden';
}

/* ============ EVENTOS ============ */
document.addEventListener('click', function(e){
  const t=e.target;
  const go=t.closest('[data-go]');
  if(go){ S.page=go.dataset.go; S.foco=null; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.closest('[data-closefoco]') || (t.dataset && t.dataset.ovl)){ S.foco=null; renderFoco(); return; }
  const fb=t.closest('[data-foco]'); if(fb){ S.foco=fb.dataset.foco; renderFoco(); return; }
  const db=t.closest('[data-drill]');
  if(db){ const f=db.dataset.drill; S.drill[f]=!S.drill[f];
    S.filtros=S.filtros.filter(x=>x.f!==f&&x.f!==HIER[f]); render(); return; }
  const ano=t.closest('[data-ano]');
  if(ano){ const a=+ano.dataset.ano;
    S.anos = S.anos.indexOf(a)>=0 ? S.anos.filter(x=>x!==a) : S.anos.concat([a]).sort();
    if(!S.anos.length) S.anos=[a];
    const disp=mesesDisponiveis(); S.meses=S.meses.filter(m=>disp.indexOf(m)>=0);
    render(); return; }
  const mes=t.closest('[data-mes]');
  if(mes){ const v=mes.dataset.mes;
    if(v==='todos') S.meses=[];
    else { const m=+v; S.meses = S.meses.indexOf(m)>=0 ? S.meses.filter(x=>x!==m) : S.meses.concat([m]).sort((a,b)=>a-b); }
    render(); return; }
  const ns=t.closest('[data-npsseg]');
  if(ns){ S.npsSegCampo=ns.dataset.npsseg; render(); return; }
  const tv=t.closest('[data-temas]');
  if(tv){ S.temasVis=tv.dataset.temas; render(); return; }
  const rm=t.closest('[data-rmf]'); if(rm){ S.filtros.splice(+rm.dataset.rmf,1); render(); return; }
  if(t.closest('[data-clear]')){ S.filtros=[]; render(); return; }
  const vt=t.closest('[data-vt]');
  if(vt){ alterna(vt.dataset.vt, vt.dataset.vid); render(); return; }
  const ad=t.closest('[data-adm]');
  if(ad){ const a=ad.dataset.adm;
    if(a==='sair'||a==='prev'){ ADM=false; try{ sessionStorage.removeItem('npdt-sessao'); }catch(e){} render(); window.scrollTo({top:0,behavior:'smooth'}); }
    else if(a==='gerar') gerarPublico();
    else if(a==='senha') trocarSenha();
    return; }
  if(t.id==='lok'){ tentaLogin(); return; }
  if(t.dataset && t.dataset.fechalogin){ fechaLogin(); return; }
  const bar=t.closest('[data-f]');
  if(bar){ const f=bar.dataset.f, v=bar.dataset.v;
    const i=S.filtros.findIndex(x=>x.f===f&&x.v===v);
    if(i>=0) S.filtros.splice(i,1); else S.filtros.push({f:f,v:v});
    render(); return; }
});
document.addEventListener('change', function(e){ if(e.target.id==='cmp'){
  S.comparar=e.target.checked;
  // parte de "todos os meses"; o usuário escolhe o recorte de mês se quiser
  S.meses = [];
  render(); } });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ if(document.getElementById('login').innerHTML){ fechaLogin(); return; } if(S.foco){ S.foco=null; renderFoco(); } return; }
  if(e.key==='Enter' && document.getElementById('login').innerHTML){ tentaLogin(); return; }
  if(!PUBLICO && !ADM && e.ctrlKey && e.shiftKey && (e.key==='N'||e.key==='n')){ e.preventDefault(); telaLogin(); }
});
let _cl=0,_ct=null;
document.getElementById('navlogo').addEventListener('click', function(){
  if(PUBLICO||ADM) return;
  _cl++; clearTimeout(_ct); _ct=setTimeout(()=>{_cl=0;},700);
  if(_cl>=3){ _cl=0; telaLogin(); }
});

document.getElementById('navlogo').src=LOGOS.npdt;
document.getElementById('navlogo').addEventListener('click',function(){ S.page='abertura'; S.foco=null; render(); window.scrollTo({top:0,behavior:'smooth'}); });
const tt=document.getElementById('tt');
document.addEventListener('mousemove', function(e){
  const el=e.target.closest('[data-tip]');
  if(!el){ tt.style.opacity=0; return; }
  tt.textContent=el.dataset.tip;
  const r=Math.min(e.clientX+14, window.innerWidth-tt.offsetWidth-10);
  tt.style.left=Math.max(8,r)+'px'; tt.style.top=(e.clientY+18)+'px'; tt.style.opacity=1;
});
render();
</script>
